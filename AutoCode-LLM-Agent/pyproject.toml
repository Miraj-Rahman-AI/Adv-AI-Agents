
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcrew-ai"
version = "0.1.0"
description = "A modular multi-agent AI collaboration framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Mahabubur Rahman Miraj"}
]
keywords = [
    "multi-agent",
    "llm",
    "agent-orchestration",
    "artificial-intelligence"
]

dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]

[project.scripts]
agentcrew = "agentcrew.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
