[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcrew-ai"
version = "0.1.0"
description = "A modular multi-agent AI collaboration framework"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Miraj Rahman" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
agentcrew = "agentcrew.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
